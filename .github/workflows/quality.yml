name: Brightdesk Wiki quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Check customer documentation and public site output
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Check out Brightdesk Wiki
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned checkout action
      - name: Set up Node.js 24.22.2
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # pinned setup-node action
        with:
          node-version: 24.22.2
          package-manager-cache: false
      - name: Check whether Ruby 3.4.4 is preinstalled
        id: ruby
        shell: bash
        run: |
          available=false
          if command -v ruby >/dev/null 2>&1 &&
             ruby -e 'exit(RUBY_VERSION == "3.4.4" ? 0 : 1)' &&
             command -v bundle >/dev/null 2>&1; then
            available=true
            ruby --version
            bundle --version
          else
            echo "::warning::Jekyll build and generated-output audit are deferred because Ruby 3.4.4 and Bundler are not preinstalled on this private runner. The workflow will not change machine permissions or install a machine-wide toolchain."
          fi
          echo "available=$available" >> "$GITHUB_OUTPUT"
      - name: Install locked Node dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned Jekyll dependency
        if: steps.ruby.outputs.available == 'true'
        run: bundle install --jobs 4 --retry 3
      - name: Verify the required Node.js runtime
        run: npm run check:node
      - name: Check validation script syntax
        run: npm run check
      - name: Run documentation and public-output regression tests
        run: npm test
      - name: Check repository Markdown links
        run: npm run links
      - name: Build Jekyll customer site
        if: steps.ruby.outputs.available == 'true'
        run: bundle exec jekyll build
      - name: Reject private or unexpected generated content
        if: steps.ruby.outputs.available == 'true'
        run: npm run check:site
      - name: Record deferred Jekyll verification
        if: steps.ruby.outputs.available != 'true'
        run: echo "Jekyll build and generated-output audit were not run because Ruby 3.4.4 and Bundler are unavailable on this runner."
