name: Brightdesk Wiki quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Keep one current check per PR; discard obsolete pending or running revisions.
concurrency:
  group: brightdesk-wiki-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Check customer documentation and public site output
    # Smallest standard GitHub-hosted Linux runner. The short timeout limits included compute use.
    runs-on: ubuntu-slim
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Check out Brightdesk Wiki
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned checkout action

      - name: Set up Node.js 24.22.2
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # pinned setup-node action
        with:
          node-version: 24.22.2
          package-manager-cache: false

      - name: Set up Ruby 3.4.4
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # pinned ruby/setup-ruby action
        with:
          ruby-version: '3.4.4'
          bundler-cache: false

      - name: Verify pinned runtimes
        run: |
          node --version
          npm --version
          ruby --version
          bundle --version
          npm run check:node

      - name: Install locked Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Check validation script syntax
        run: npm run check

      - name: Run documentation and public-output regression tests
        run: npm test

      - name: Check repository Markdown links
        run: npm run links

      - name: Install pinned Jekyll dependencies
        run: bundle install --jobs 4 --retry 3

      - name: Build Jekyll customer site
        run: bundle exec jekyll build

      - name: Reject private or unexpected generated content
        run: npm run check:site
