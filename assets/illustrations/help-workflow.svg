<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">How to use a Brightdesk Help guide</title><desc id="desc">Four steps: choose a product, open a guide, follow the steps, and check the result.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f6f8fd"/><stop offset="1" stop-color="#f0f3fa"/></linearGradient><style>.h{font:700 32px system-ui,sans-serif;fill:#1b2940}.n{font:700 24px system-ui,sans-serif;fill:#263752}.s{font:500 17px system-ui,sans-serif;fill:#5b6a80}.card{fill:#fff;stroke:#d5deeb;stroke-width:2}</style></defs>
<rect width="1200" height="520" rx="28" fill="url(#bg)"/><text x="600" y="75" text-anchor="middle" class="h">Find the answer. Follow the steps.</text>
<g><rect class="card" x="55" y="165" width="245" height="220" rx="22"/><circle cx="177" cy="235" r="38" fill="#e8efff"/><path d="M157 220h40v30h-40z M165 211h24" stroke="#416bc0" stroke-width="4" fill="none" stroke-linejoin="round"/><text x="177" y="315" text-anchor="middle" class="n">1. Choose</text><text x="177" y="348" text-anchor="middle" class="s">Select your product</text>
<rect class="card" x="350" y="165" width="245" height="220" rx="22"/><circle cx="472" cy="235" r="38" fill="#f0eaff"/><path d="M455 215h34v42h-34z M462 226h20 M462 237h20 M462 248h14" stroke="#7652b8" stroke-width="3" fill="none"/><text x="472" y="315" text-anchor="middle" class="n">2. Open</text><text x="472" y="348" text-anchor="middle" class="s">Find the right guide</text>
<rect class="card" x="645" y="165" width="245" height="220" rx="22"/><circle cx="767" cy="235" r="38" fill="#e7f5ed"/><path d="M748 237l13 13 26-30" stroke="#34865b" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="767" y="315" text-anchor="middle" class="n">3. Follow</text><text x="767" y="348" text-anchor="middle" class="s">Work through each step</text>
<rect class="card" x="940" y="165" width="205" height="220" rx="22"/><circle cx="1042" cy="235" r="38" fill="#fff2e4"/><path d="M1025 235l12 12 24-26" stroke="#bd7835" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="1042" y="315" text-anchor="middle" class="n">4. Check</text><text x="1042" y="348" text-anchor="middle" class="s">Confirm the result</text></g>
<g stroke="#9cabc0" stroke-width="4" fill="none" stroke-linecap="round"><path d="M300 275h50m-16-14 16 14-16 14 M595 275h50m-16-14 16 14-16 14 M890 275h50m-16-14 16 14-16 14"/></g>
</svg>