<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Brightdesk local-first privacy model</title><desc id="desc">A document remains on the user's device. Optional official updates are shown separately from document content.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f5f8ff"/><stop offset="1" stop-color="#edf5f2"/></linearGradient><style>.heading{font:700 32px system-ui,sans-serif;fill:#1c2b40}.label{font:650 22px system-ui,sans-serif;fill:#22324a}.copy{font:500 17px system-ui,sans-serif;fill:#59697d}.stroke{stroke:#9aabc2;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}</style></defs>
<rect width="1200" height="680" rx="28" fill="url(#bg)"/><text x="600" y="70" text-anchor="middle" class="heading">Your work stays yours</text><text x="600" y="105" text-anchor="middle" class="copy">Local-first by design, with a clear boundary for official updates</text>
<rect x="90" y="170" width="650" height="390" rx="26" fill="#fff" stroke="#cbd6e5" stroke-width="3"/><text x="415" y="220" text-anchor="middle" class="label">Your device</text>
<rect x="155" y="270" width="240" height="210" rx="18" fill="#edf3ff" stroke="#9fb8e8" stroke-width="2"/><path d="M235 320h80l35 35v90H235z" fill="#fff" stroke="#5277c5" stroke-width="4" stroke-linejoin="round"/><path d="M315 320v38h35 M255 385h75 M255 410h75" class="stroke"/><text x="275" y="520" text-anchor="middle" class="copy">Documents and settings</text>
<rect x="455" y="270" width="220" height="210" rx="18" fill="#eef7f2" stroke="#9bc9ae" stroke-width="2"/><path d="M565 315v75m-30-30 30 30 30-30" class="stroke"/><path d="M510 410h110" class="stroke"/><text x="565" y="450" text-anchor="middle" class="copy">Local processing</text>
<path d="M395 375h60" class="stroke"/><path d="M435 360l20 15-20 15" class="stroke"/>
<rect x="825" y="235" width="285" height="255" rx="24" fill="#fff" stroke="#cbd6e5" stroke-width="3"/><circle cx="967" cy="315" r="42" fill="#f1f4fb" stroke="#7890b6" stroke-width="3"/><path d="M967 285v35m-18-18 18 18 18-18" class="stroke"/><text x="967" y="395" text-anchor="middle" class="label">Official updates</text><text x="967" y="430" text-anchor="middle" class="copy">Product and language</text><text x="967" y="455" text-anchor="middle" class="copy">resources only</text>
<path d="M740 360h85" class="stroke" stroke-dasharray="9 10"/><text x="782" y="335" text-anchor="middle" class="copy">Separate</text>
<text x="600" y="625" text-anchor="middle" class="copy">No document-content upload, telemetry, advertising, or cloud sync</text>
</svg>