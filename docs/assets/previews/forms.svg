<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="t d"><title id="t">Brightdesk Forms workspace preview</title><desc id="d">Conceptual form builder with a question list, live form preview and properties panel.</desc><defs><linearGradient id="s" x2="0" y2="1"><stop stop-color="#14233F"/><stop offset="1" stop-color="#0D1930"/></linearGradient></defs><rect width="1440" height="900" fill="#F3F6FA"/><rect width="232" height="900" fill="url(#s)"/><rect x="24" y="24" width="42" height="42" rx="12" fill="#526FE0"/><path d="M34 34h9v9h-9zm13 0h9v9h-9zM34 47h9v9h-9zm13 0h9v9h-9z" fill="#fff"/><text x="78" y="53" font-family="Arial" font-size="24" font-weight="700" fill="#fff">brightdesk</text><text x="28" y="112" font-family="Arial" font-size="10" letter-spacing="2" fill="#899AB6">FORMS</text><rect x="16" y="132" width="200" height="44" rx="10" fill="#293B60"/><text x="52" y="160" font-family="Arial" font-size="14" font-weight="700" fill="#fff">My forms</text><text x="52" y="215" font-family="Arial" font-size="14" fill="#C3CDE0">Drafts</text><text x="52" y="263" font-family="Arial" font-size="14" fill="#C3CDE0">Responses</text><text x="52" y="311" font-family="Arial" font-size="14" fill="#C3CDE0">Templates</text><text x="270" y="55" font-family="Arial" font-size="11" letter-spacing="2" fill="#7A8AA1">BRIGHTDESK FORMS</text><text x="270" y="100" font-family="Arial" font-size="31" font-weight="700" fill="#1C2D47">Customer feedback</text><text x="270" y="129" font-family="Arial" font-size="14" fill="#738198">Build clear forms and review responses in one workspace.</text><rect x="270" y="158" width="1134" height="44" rx="10" fill="#fff" stroke="#E1E7F0"/><g font-family="Arial" font-size="12" fill="#55657D"><text x="292" y="185">Questions</text><text x="390" y="185">Preview</text><text x="463" y="185">Responses</text></g><path d="M288 199h74" stroke="#BD4C8B" stroke-width="3" stroke-linecap="round"/><rect x="270" y="218" width="240" height="590" rx="12" fill="#fff" stroke="#E1E7F0"/><text x="292" y="252" font-family="Arial" font-size="14" font-weight="700" fill="#31435D">Questions</text><rect x="286" y="271" width="208" height="57" rx="8" fill="#FCEAF4" stroke="#E7B9D3"/><text x="302" y="294" font-family="Arial" font-size="11" font-weight="700" fill="#9E4778">1 · Overall experience</text><text x="302" y="313" font-family="Arial" font-size="10" fill="#9B7990">Rating · Required</text><text x="302" y="361" font-family="Arial" font-size="11" fill="#566780">2 · What worked well?</text><text x="302" y="416" font-family="Arial" font-size="11" fill="#566780">3 · What could improve?</text><rect x="286" y="458" width="208" height="38" rx="8" fill="#F7F9FC"/><text x="302" y="482" font-family="Arial" font-size="11" fill="#60718A">+ Add a question</text><rect x="530" y="218" width="570" height="590" rx="12" fill="#E9EEF5" stroke="#E1E7F0"/><rect x="570" y="250" width="490" height="520" rx="8" fill="#fff" stroke="#E0E6EE"/><rect x="570" y="250" width="490" height="115" rx="8" fill="#FFF0F7"/><text x="608" y="296" font-family="Arial" font-size="23" font-weight="700" fill="#303D55">Customer feedback</text><text x="608" y="327" font-family="Arial" font-size="12" fill="#6D7A90">Tell us about your experience.</text><text x="608" y="406" font-family="Arial" font-size="14" font-weight="700" fill="#33445F">How would you rate us?</text><g fill="#E5A1C6"><circle cx="625" cy="447" r="12"/><circle cx="659" cy="447" r="12"/><circle cx="693" cy="447" r="12"/><circle cx="727" cy="447" r="12"/><circle cx="761" cy="447" r="12"/></g><text x="608" y="509" font-family="Arial" font-size="14" font-weight="700" fill="#33445F">What worked well?</text><rect x="608" y="526" width="410" height="64" rx="8" fill="#fff" stroke="#DBE2EB"/><text x="626" y="551" font-family="Arial" font-size="11" fill="#A0AABA">Type your answer…</text><rect x="608" y="624" width="130" height="40" rx="8" fill="#BD4C8B"/><text x="673" y="649" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#fff">Submit</text><rect x="1120" y="218" width="284" height="590" rx="12" fill="#fff" stroke="#E1E7F0"/><text x="1144" y="252" font-family="Arial" font-size="14" font-weight="700" fill="#31435D">Question settings</text><text x="1144" y="292" font-family="Arial" font-size="11" fill="#687991">Answer type</text><rect x="1144" y="308" width="236" height="38" rx="7" fill="#F4F6F9"/><text x="1160" y="332" font-family="Arial" font-size="11" fill="#51627A">Rating scale</text><text x="1144" y="382" font-family="Arial" font-size="11" fill="#687991">Options</text><rect x="1144" y="398" width="236" height="38" rx="7" fill="#F4F6F9"/><text x="1160" y="422" font-family="Arial" font-size="11" fill="#51627A">Five points</text><rect x="1144" y="464" width="236" height="54" rx="8" fill="#FCEAF4"/><text x="1160" y="487" font-family="Arial" font-size="11" font-weight="700" fill="#9E4778">Required question</text><text x="1160" y="504" font-family="Arial" font-size="10" fill="#A27B91">Respondents must answer</text><text x="270" y="886" font-family="Arial" font-size="10" fill="#8B97A9">CONCEPT PREVIEW · Illustrative design target, not a finished-build screenshot.</text></svg>