<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="t d"><title id="t">Brightdesk Notes workspace preview</title><desc id="d">Conceptual notebook interface with notebook navigation, rich note canvas, callout and checklist cards.</desc><defs><linearGradient id="s" x2="0" y2="1"><stop stop-color="#14233F"/><stop offset="1" stop-color="#0D1930"/></linearGradient></defs><rect width="1440" height="900" fill="#F3F6FA"/><rect width="232" height="900" fill="url(#s)"/><rect x="24" y="24" width="42" height="42" rx="12" fill="#526FE0"/><path d="M34 34h9v9h-9zm13 0h9v9h-9zM34 47h9v9h-9zm13 0h9v9h-9z" fill="#fff"/><text x="78" y="53" font-family="Arial" font-size="24" font-weight="700" fill="#fff">brightdesk</text><text x="28" y="112" font-family="Arial" font-size="10" letter-spacing="2" fill="#899AB6">NOTEBOOKS</text><rect x="16" y="132" width="200" height="44" rx="10" fill="#293B60"/><text x="52" y="160" font-family="Arial" font-size="14" font-weight="700" fill="#fff">Ideas notebook</text><text x="52" y="215" font-family="Arial" font-size="14" fill="#C3CDE0">Quick notes</text><text x="52" y="263" font-family="Arial" font-size="14" fill="#C3CDE0">Projects</text><text x="52" y="311" font-family="Arial" font-size="14" fill="#C3CDE0">Pinned</text><rect x="250" y="0" width="260" height="900" fill="#FAFBFD"/><text x="278" y="58" font-family="Arial" font-size="11" letter-spacing="2" fill="#8794A8">IDEAS NOTEBOOK</text><text x="278" y="99" font-family="Arial" font-size="22" font-weight="700" fill="#263750">Pages</text><rect x="270" y="124" width="222" height="42" rx="9" fill="#F1F4F8"/><text x="290" y="151" font-family="Arial" font-size="12" fill="#586980">Project ideas</text><rect x="270" y="178" width="222" height="42" rx="9" fill="#FFF4DF"/><text x="290" y="205" font-family="Arial" font-size="12" font-weight="700" fill="#8D682D">Planning notes</text><text x="270" y="254" font-family="Arial" font-size="12" fill="#65758B">Meeting notes</text><text x="270" y="301" font-family="Arial" font-size="12" fill="#65758B">Reading list</text><text x="550" y="58" font-family="Arial" font-size="11" letter-spacing="2" fill="#7B8AA1">TUESDAY · 10:30 AM</text><text x="550" y="105" font-family="Arial" font-size="31" font-weight="700" fill="#1C2D47">Planning notes</text><text x="550" y="136" font-family="Arial" font-size="14" fill="#738198">Capture thoughts and shape them into clear next steps.</text><rect x="550" y="168" width="840" height="620" rx="14" fill="#fff" stroke="#E1E7F0"/><rect x="590" y="205" width="760" height="92" rx="11" fill="#FFF7E7"/><rect x="590" y="205" width="6" height="92" rx="3" fill="#D49A3A"/><text x="618" y="239" font-family="Arial" font-size="12" font-weight="700" fill="#956B2B">MAIN IDEA</text><text x="618" y="270" font-family="Arial" font-size="17" fill="#4D4433">Keep the project simple, visible and easy to move forward.</text><text x="590" y="350" font-family="Arial" font-size="20" font-weight="700" fill="#293B55">What matters most</text><g fill="#B9C4D2"><rect x="590" y="379" width="730" height="7" rx="3.5"/><rect x="590" y="397" width="700" height="7" rx="3.5"/><rect x="590" y="415" width="720" height="7" rx="3.5"/></g><rect x="590" y="454" width="340" height="188" rx="11" fill="#F8FAFC" stroke="#E4EAF1"/><text x="614" y="484" font-family="Arial" font-size="14" font-weight="700" fill="#31435D">Next steps</text><g font-family="Arial" font-size="12" fill="#52647C"><text x="644" y="526">Confirm the outline</text><text x="644" y="563">Collect the key details</text><text x="644" y="600">Review the finished draft</text></g><g fill="#D49A3A"><rect x="614" y="512" width="15" height="15" rx="4"/><rect x="614" y="549" width="15" height="15" rx="4"/><rect x="614" y="586" width="15" height="15" rx="4"/></g><rect x="952" y="454" width="368" height="188" rx="11" fill="#F8FAFC" stroke="#E4EAF1"/><text x="976" y="484" font-family="Arial" font-size="14" font-weight="700" fill="#3143